:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F9FAFB;--sunk:#F0F2F5;
  --ink:#11141A;--ink-2:#4A5262;--ink-3:#687083;--line:#E3E6EB;--line-2:#EDEFF2;
  --accent:#F2541B;--accent-ink:#C2410C;--accent-tint:#FFF1EB;
  --up:#18794E;--down:#C4320A;
  --bar:#2A2F3A;
  --r:12px;
  --shadow:0 1px 2px rgba(16,20,28,.04),0 2px 8px rgba(16,20,28,.04);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme=dark]{
  --bg:#141210;--surface:#1C1A17;--surface-2:#221F1C;--sunk:#2A2622;
  --ink:#F3EEE7;--ink-2:#C9C1B6;--ink-3:#9E968A;--line:#332E29;--line-2:#28241F;
  --accent:#FF7A45;--accent-ink:#FF9C73;--accent-tint:#33200F;
  --up:#5BCB93;--down:#FF8F6B;--bar:#E8E0D3;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141210;--surface:#1C1A17;--surface-2:#221F1C;--sunk:#2A2622;
  --ink:#F3EEE7;--ink-2:#C9C1B6;--ink-3:#9E968A;--line:#332E29;--line-2:#28241F;
  --accent:#FF7A45;--accent-ink:#FF9C73;--accent-tint:#33200F;
  --up:#5BCB93;--down:#FF8F6B;--bar:#E8E0D3;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:0 28px}
.row1{display:flex;align-items:center;gap:14px;height:60px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px;stroke:var(--bg)}
.mark.logo{background:none;width:auto;max-width:120px;border-radius:0}
.mark.logo img{height:30px;width:auto;max-width:120px;object-fit:contain;display:block}
.prep{color:var(--ink-3);font-weight:600;font-size:13px;white-space:nowrap}
.title{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.title span{color:var(--ink-3);font-weight:600}
.spacer{flex:1}
.stamp{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.stamp b{color:var(--ink-2);font-weight:650}
